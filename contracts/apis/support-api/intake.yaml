schema_bundle:
  service_id: support-intake-api
  owner_boundary: platform
  status: contract-only
  purpose: accept reusable public customer inquiries and provide audited sanitized source detail reads without copying inquiry content into the admin projection
  common_envelope:
    required_request_metadata:
      - request_id
      - trace_id
      - idempotency_key
    required_response_metadata:
      - request_id
      - trace_id
    forbidden_payload_values:
      - raw_customer_payload
      - authorization_header
      - cookie_header
      - refresh_token_plaintext
      - provider_secret
      - raw_provider_error
      - payment_credential
      - identity_document
      - stack_trace
      - screen_component_payload
  schemas:
    - id: SupportCaseCreateRequest
      kind: request
      carries_secret_material: true
      secret_material_policy: verification_receipt_input_only_never_echo_or_persist_plaintext
      required_fields:
        - request_kind
        - reply_address
        - message
        - locale
        - abuse_verification_ref
      optional_fields:
        - product_id
        - privacy_action
        - account_ref
      secret_fields:
        - abuse_verification_ref
      properties:
        request_kind:
          type: string
        reply_address:
          type: string
          format: email
        message:
          type: string
        locale:
          type: string
        abuse_verification_ref:
          type: string
        product_id:
          type: string
        privacy_action:
          type: string
        account_ref:
          type: string
    - id: SupportCaseCreateResponse
      kind: response
      carries_secret_material: false
      session_effect: none
      required_fields:
        - case_id
        - received_at
        - verification_state
        - next_step
      properties:
        case_id:
          type: string
        received_at:
          type: string
          format: date-time
        verification_state:
          type: string
        next_step:
          type: string
    - id: SupportCaseDetailReadRequest
      kind: request
      carries_secret_material: false
      required_fields:
        - expected_source_version
        - purpose
        - reason
        - audit_request_id
        - audit_policy_version
      properties:
        expected_source_version:
          type: integer
        purpose:
          type: string
        reason:
          type: string
        audit_request_id:
          type: string
        audit_policy_version:
          type: string
    - id: SupportCaseDetailReadResponse
      kind: response
      carries_secret_material: false
      session_effect: none
      required_fields:
        - case_id
        - source_version
        - request_kind
        - source_state
        - sanitized_message
        - masked_reply_address
        - locale
        - opened_at
        - last_activity_at
        - content_access
      optional_fields:
        - product_id
        - privacy_action
      properties:
        case_id:
          type: string
        source_version:
          type: integer
        request_kind:
          type: string
        source_state:
          type: string
        sanitized_message:
          type: string
        masked_reply_address:
          type: string
        locale:
          type: string
        opened_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        content_access:
          type: string
        product_id:
          type: string
        privacy_action:
          type: string
    - id: SupportCaseStatusChangeRequest
      kind: request
      carries_secret_material: false
      required_fields:
        - expected_source_version
        - target_state
        - reason
        - audit_request_id
        - audit_policy_version
      properties:
        expected_source_version:
          type: integer
        target_state:
          type: string
        reason:
          type: string
        audit_request_id:
          type: string
        audit_policy_version:
          type: string
    - id: SupportCaseStatusChangeResponse
      kind: response
      carries_secret_material: false
      session_effect: none
      required_fields:
        - case_id
        - source_version
        - source_state
        - changed_at
        - replayed
      properties:
        case_id:
          type: string
        source_version:
          type: integer
        source_state:
          type: string
        changed_at:
          type: string
          format: date-time
        replayed:
          type: boolean
    - id: SupportCaseReplyCreateRequest
      kind: request
      carries_secret_material: false
      required_fields:
        - expected_source_version
        - message
        - reason
        - audit_request_id
        - audit_policy_version
      properties:
        expected_source_version:
          type: integer
        message:
          type: string
        reason:
          type: string
        audit_request_id:
          type: string
        audit_policy_version:
          type: string
    - id: SupportCaseReplyCreateResponse
      kind: response
      carries_secret_material: false
      session_effect: none
      required_fields:
        - case_id
        - reply_id
        - source_version
        - source_state
        - delivery_state
        - created_at
        - replayed
      properties:
        case_id:
          type: string
        reply_id:
          type: string
        source_version:
          type: integer
        source_state:
          type: string
        delivery_state:
          type: string
        created_at:
          type: string
          format: date-time
        replayed:
          type: boolean
    - id: SupportCaseReplyAddressVerifyRequest
      kind: request
      carries_secret_material: true
      secret_material_policy: verification_receipt_input_only_never_echo_or_persist_plaintext
      required_fields:
        - verification_ref
      secret_fields:
        - verification_ref
      properties:
        verification_ref:
          type: string
    - id: SupportCaseReplyAddressVerifyResponse
      kind: response
      carries_secret_material: false
      session_effect: none
      required_fields:
        - case_id
        - source_version
        - source_state
        - changed_at
        - replayed
      properties:
        case_id:
          type: string
        source_version:
          type: integer
        source_state:
          type: string
        changed_at:
          type: string
          format: date-time
        replayed:
          type: boolean
