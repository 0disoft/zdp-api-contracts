api_catalog:
  status: route-catalog-contract-only
  route_definition_required_fields:
    - operation_id
    - service_id
    - resource
    - action
    - method
    - path
    - success_statuses
    - request_schema_ref
    - response_schema_ref
    - auth_required
    - permission_check
    - audit_event
    - idempotency
    - owner_boundary
    - tenant_boundary
    - request_id_required
    - trace_id_required
    - session_effect
    - credential_policy
    - error_codes
  forbidden_values:
    - raw_customer_payload
    - raw_provider_error
    - provider_secret
    - authorization_header
    - cookie_header
    - refresh_token_plaintext
    - stack_trace
    - screen_component_payload

routes:
  - operation_id: platform.support.cases.create
    service_id: support-intake-api
    resource: support_case
    action: create
    method: POST
    path: /v1/support/cases
    success_statuses:
      - 201
    request_schema_ref: contracts/apis/support-api/intake.yaml#SupportCaseCreateRequest
    response_schema_ref: contracts/apis/support-api/intake.yaml#SupportCaseCreateResponse
    auth_required: false
    permission_check: platform.support.public_case_create
    audit_event: platform.support.case.received
    idempotency: required_idempotency_key
    owner_boundary: platform
    tenant_boundary: pending_identity_or_organization
    request_id_required: true
    trace_id_required: true
    session_effect: none
    credential_policy: no_refresh_token_plaintext_no_provider_secret_no_authorization_or_cookie_header_payload
    export_policy: edge_bff_only_transport_proof_and_deployment_registered_organization_not_direct_origin
    error_codes:
      - validation_failed
      - origin_proof_failed
      - abuse_verification_failed
      - rate_limited
      - idempotency_conflict
      - support_intake_unavailable
