oidc_client_registry:
  schema_version: 2
  status: proposed-contract
  owner_boundary: identity
  authority: core_identity
  environment: staging
  registry_revision: 1
  source_of_truth: reviewed_core_identity_registry
  update_policy: compare_and_swap_registry_revision_and_audit_receipt
  environment_isolation: exact_environment_match_no_cross_environment_projection
  client_id_reuse_policy: retired_client_ids_are_tombstoned_and_never_reused
  lifecycle:
    states:
      - disabled
      - active
      - suspended
      - retired
    terminal_states:
      - retired
    allowed_transitions:
      - from: disabled
        to: active
        required_evidence: activation_requirements_and_review_receipt
      - from: active
        to: suspended
        required_evidence: security_or_operational_reason_and_revocation_receipt
      - from: suspended
        to: active
        required_evidence: remediation_evidence_and_reactivation_review_receipt
      - from: disabled
        to: retired
        required_evidence: retirement_reason_and_audit_receipt
      - from: suspended
        to: retired
        required_evidence: retirement_reason_and_audit_receipt
  immutable_fields:
    - client_id
    - product_ref
    - environment
    - client_type
  security_sensitive_fields:
    - exact_redirect_uris
    - exact_post_logout_redirect_uris
    - allowed_scope_refs
    - allowed_audience_refs
    - token_endpoint_auth_method
    - jwks_ref
    - session_policy_ref
    - revocation_policy_ref
    - runtime_boundary
    - callback_handler_ref
  required_audit_events:
    - oidc_client.registered
    - oidc_client.activation_reviewed
    - oidc_client.activated
    - oidc_client.security_configuration_changed
    - oidc_client.suspended
    - oidc_client.reactivated
    - oidc_client.retired
    - oidc_client.keyset_rotated
  entries:
    - client_id: zdp-web-public-staging
      product_ref: web-public-home
      owner_ref: zdp-web-public
      environment: staging
      entry_revision: 1
      application_type: web
      exact_redirect_uris:
        - https://web-public.staging.8ailors.xyz/auth/callback
      exact_post_logout_redirect_uris:
        - https://web-public.staging.8ailors.xyz/
      allowed_scope_refs:
        - openid
        - profile
      allowed_audience_refs:
        - zdp-web-public
      allowed_grant_types:
        - authorization_code
      allowed_response_types:
        - code
      allowed_pkce_methods:
        - S256
      client_type: confidential
      token_endpoint_auth_method: private_key_jwt
      jwks_ref: client-keyset://zdp-web-public-staging
      status: disabled
      status_reason: callback_runtime_not_deployed
      session_policy_ref: oidc-provider-runtime-v1-product-session
      revocation_policy_ref: oidc-provider-runtime-v1-revocation
      key_rotation_policy_ref: oidc-provider-runtime-v1-client-key-rotation
      runtime_boundary: product_bff_required_static_site_forbidden
      callback_handler_ref: zdp-web-public-bff-candidate
      activation_requirements:
        - product_bff_deployed_in_staging
        - staging_hostname_bound_and_tls_verified
        - private_key_jwt_key_registered_without_plaintext_secret
        - exact_callback_and_logout_smoke_passed
        - central_session_revocation_smoke_passed
        - core_access_denial_smoke_passed
      activation_evidence_refs: []
  forbidden_values:
    - client_secret_plaintext
    - private_key_material
    - authorization_code
    - access_token
    - id_token
    - refresh_token_plaintext
    - cookie_header
    - authorization_header
    - raw_customer_payload
