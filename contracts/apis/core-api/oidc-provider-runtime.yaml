oidc_provider_runtime:
  schema_version: 1
  status: proposed-contract
  owner_boundary: identity
  pilot_environment: staging
  issuer: https://account.staging.8ailors.xyz
  discovery_path: /.well-known/openid-configuration
  authorization_path: /oauth2/authorize
  token_path: /oauth2/token
  jwks_path: /.well-known/jwks.json
  revocation_path: /oauth2/revoke
  end_session_path: /oauth2/logout
  authorization_code_ttl_seconds: 60
  authorization_code_single_use: true
  authorization_code_storage_policy: opaque_random_code_hash_only_atomic_consume
  authorization_code_required_bindings:
    - client_id
    - exact_redirect_uri
    - subject_ref
    - central_session_ref
    - nonce
    - code_challenge
    - code_challenge_method
    - granted_scope_refs
    - granted_audience_refs
    - issued_at
    - expires_at
  access_token_ttl_seconds: 300
  id_token_ttl_seconds: 300
  refresh_token_policy: not_issued_in_first_staging_pilot
  client_assertion_algorithm: RS256
  client_assertion_ttl_seconds: 60
  client_assertion_jti_single_use: true
  client_assertion_binding_policy: iss_and_sub_equal_client_id_aud_exact_token_endpoint
  signing_algorithm: RS256
  signing_key_rotation_days: 30
  retired_key_verification_seconds: 86400
  jwks_cache_max_age_seconds: 300
  central_session_idle_seconds: 1209600
  central_session_absolute_seconds: 2592000
  product_session_idle_max_seconds: 1209600
  product_session_absolute_max_seconds: 2592000
  sensitive_action_fresh_seconds: 900
  revocation_max_staleness_seconds: 60
  product_session_revalidation_policy: binding_must_not_outlive_central_session_and_core_access_rechecks_every_protected_action
  required_denial_reasons:
    - authentication_required
    - session_expired
    - session_revoked
    - client_disabled
    - invalid_request
    - invalid_grant
    - access_denied
    - policy_unavailable
  forbidden_values:
    - password
    - authorization_header
    - cookie_header
    - access_token
    - id_token
    - refresh_token_plaintext
    - client_secret_plaintext
    - private_key_material
    - authorization_code_plaintext_at_rest
    - code_verifier_plaintext_at_rest
    - raw_provider_error
    - raw_customer_payload
