schema_bundle:
  service_id: core-api
  owner_boundary: identity
  status: contract-only
  purpose: >-
    비공개 선택 프로필의 원자적 교체와 멱등 재시도. 선택 정보는 본인과 Core만 읽는다.
    선택값을 저장하는 요청(birth_year 또는 interests가 비어 있지 않음)은 private 헤더
    x-zdp-profile-consent에 account-optional-profile-v1을 전달하고 Core가 재검증한다.
    비우기(clear)에는 불필요하다. BFF는 동의 여부를 판정하는 권한 주체가 아니다.
    body는 birth_year, interests 두 필드 그대로다.
  common_envelope:
    required_request_metadata: [request_id, trace_id, idempotency_key]
    required_response_metadata: [request_id, trace_id]
    forbidden_payload_values: [authorization_header, cookie_header, refresh_token_plaintext, provider_secret, raw_provider_error, raw_customer_payload, stack_trace, screen_component_payload]
  schemas:
    - id: AccountPreferencesUpdateRequest
      kind: request
      carries_secret_material: false
      required_fields: [birth_year, interests]
      properties:
        birth_year:
          type: integer
          nullable: true
        interests:
          type: array
          items:
            type: string
            enum: [technology, programming, design, science, business, productivity, education, books, music, gaming, sports, travel, cooking, art]
