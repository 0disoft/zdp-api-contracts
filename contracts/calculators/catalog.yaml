calculator_contract:
  schema_version: 1
  status: draft
  contract_version: "1.0.0"
  owner_boundary: calculator_contracts
  required_definition_fields:
    - id
    - lifecycle_status
    - contract_version
    - compatible_engine_versions
    - jurisdiction
    - precision_policy
    - rounding_policy
    - inputs
    - outputs
    - error_codes
    - semantic_rules
  allowed_lifecycle_statuses:
    - draft
    - reviewed
    - active
    - retired
  allowed_value_kinds:
    - decimal
    - integer
    - date
    - enum
  allowed_unit_dimensions:
    - dimensionless
    - percent
    - currency
    - count
    - duration
    - data_size
    - data_rate
    - date
  allowed_unit_policies:
    - none
    - caller_supplied
    - enumerated
  stable_error_codes:
    - invalid_input
    - domain_error
    - limit_exceeded
    - contract_mismatch
    - denominator_zero
    - non_positive_contribution_margin
    - unsupported_unit
    - incompatible_units
    - invalid_date_range
    - precision_policy_required
    - rounding_policy_required

definitions:
  - id: percentage-change
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions:
      - "0.x"
    jurisdiction: global
    precision_policy: canonical_ascii_decimal_string_max_1000_digits
    rounding_policy: caller_decimal_places_0_to_100_half_away_from_zero
    inputs:
      - id: initial_value
        value_kind: decimal
        unit_dimension: dimensionless
        unit_policy: none
        unit_options: []
        allowed_values: []
        required: true
        domain: any_finite_decimal
      - id: final_value
        value_kind: decimal
        unit_dimension: dimensionless
        unit_policy: none
        unit_options: []
        allowed_values: []
        required: true
        domain: any_finite_decimal
    outputs:
      - id: percentage_change
        value_kind: decimal
        unit_dimension: percent
        unit_policy: enumerated
        unit_options:
          - percent
    error_codes:
      - invalid_input
      - domain_error
      - limit_exceeded
      - contract_mismatch
      - denominator_zero
      - precision_policy_required
      - rounding_policy_required
    semantic_rules:
      - percentage_change_is_final_minus_initial_divided_by_initial_times_100
      - initial_value_is_denominator
      - zero_initial_value_returns_denominator_zero
      - signed_result_is_preserved

  - id: margin-markup
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions:
      - "0.x"
    jurisdiction: global
    precision_policy: canonical_ascii_decimal_string_max_1000_digits
    rounding_policy: caller_decimal_places_0_to_100_half_away_from_zero
    inputs:
      - id: cost
        value_kind: decimal
        unit_dimension: currency
        unit_policy: caller_supplied
        unit_options: []
        allowed_values: []
        required: true
        domain: non_negative_finite_decimal
      - id: selling_price
        value_kind: decimal
        unit_dimension: currency
        unit_policy: caller_supplied
        unit_options: []
        allowed_values: []
        required: true
        domain: non_negative_finite_decimal
    outputs:
      - id: margin_percentage
        value_kind: decimal
        unit_dimension: percent
        unit_policy: enumerated
        unit_options:
          - percent
      - id: markup_percentage
        value_kind: decimal
        unit_dimension: percent
        unit_policy: enumerated
        unit_options:
          - percent
    error_codes:
      - invalid_input
      - domain_error
      - limit_exceeded
      - contract_mismatch
      - denominator_zero
      - incompatible_units
      - precision_policy_required
      - rounding_policy_required
    semantic_rules:
      - gross_profit_is_selling_price_minus_cost
      - margin_uses_selling_price_as_denominator
      - markup_uses_cost_as_denominator
      - zero_cost_or_selling_price_returns_denominator_zero
      - cost_and_selling_price_currency_must_match

  - id: break-even-point
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions:
      - "0.x"
    jurisdiction: global
    precision_policy: canonical_ascii_decimal_string_max_1000_digits
    rounding_policy: caller_decimal_places_0_to_100_half_away_from_zero
    inputs:
      - id: fixed_cost
        value_kind: decimal
        unit_dimension: currency
        unit_policy: caller_supplied
        unit_options: []
        allowed_values: []
        required: true
        domain: non_negative_finite_decimal
      - id: unit_price
        value_kind: decimal
        unit_dimension: currency
        unit_policy: caller_supplied
        unit_options: []
        allowed_values: []
        required: true
        domain: positive_finite_decimal
      - id: unit_variable_cost
        value_kind: decimal
        unit_dimension: currency
        unit_policy: caller_supplied
        unit_options: []
        allowed_values: []
        required: true
        domain: non_negative_finite_decimal
    outputs:
      - id: contribution_margin_per_unit
        value_kind: decimal
        unit_dimension: currency
        unit_policy: caller_supplied
        unit_options: []
      - id: break_even_quantity
        value_kind: decimal
        unit_dimension: count
        unit_policy: enumerated
        unit_options:
          - items
    error_codes:
      - invalid_input
      - domain_error
      - limit_exceeded
      - contract_mismatch
      - non_positive_contribution_margin
      - incompatible_units
      - precision_policy_required
      - rounding_policy_required
    semantic_rules:
      - contribution_margin_is_unit_price_minus_unit_variable_cost
      - non_positive_contribution_margin_returns_specific_error
      - break_even_quantity_is_fixed_cost_divided_by_contribution_margin
      - break_even_quantity_is_theoretical_and_not_implicitly_rounded_to_whole_items
      - all_currency_inputs_must_match

  - id: compound-interest
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions:
      - "0.4.0"
      - "0.5.0"
    jurisdiction: global
    precision_policy: canonical_ascii_decimal_string_max_1000_digits
    rounding_policy: caller_decimal_places_0_to_100_half_away_from_zero
    inputs:
      - id: principal
        value_kind: decimal
        unit_dimension: currency
        unit_policy: caller_supplied
        unit_options: []
        allowed_values: []
        required: true
        domain: non_negative_finite_decimal
      - id: nominal_annual_rate
        value_kind: decimal
        unit_dimension: dimensionless
        unit_policy: none
        unit_options: []
        allowed_values: []
        required: true
        domain: finite_decimal_greater_than_negative_one
      - id: compounding_periods
        value_kind: integer
        unit_dimension: count
        unit_policy: none
        unit_options: []
        allowed_values: []
        required: true
        domain: canonical_unsigned_integer_string_not_exceeding_frequency_times_100
      - id: compounding_frequency
        value_kind: enum
        unit_dimension: dimensionless
        unit_policy: none
        unit_options: []
        allowed_values:
          - "1_per_year"
          - "2_per_year"
          - "4_per_year"
          - "12_per_year"
          - "365_per_year"
        required: true
        domain: allowed_values_only
    outputs:
      - id: future_value
        value_kind: decimal
        unit_dimension: currency
        unit_policy: caller_supplied
        unit_options: []
      - id: interest_earned
        value_kind: decimal
        unit_dimension: currency
        unit_policy: caller_supplied
        unit_options: []
    error_codes:
      - invalid_input
      - domain_error
      - limit_exceeded
      - contract_mismatch
      - precision_policy_required
      - rounding_policy_required
    semantic_rules:
      - nominal_annual_rate_is_decimal_ratio
      - compounding_frequency_is_periods_per_year
      - future_value_uses_discrete_compounding
      - compounding_periods_is_the_exact_non_negative_integer_exponent
      - compounding_periods_must_not_exceed_frequency_times_100
      - reduced_power_operand_estimated_digits_must_not_exceed_250000
      - exact_rational_intermediates_are_not_rounded
      - future_value_and_interest_earned_are_rounded_independently_from_exact_values
      - interest_earned_is_exact_future_value_minus_exact_principal
      - principal_currency_is_preserved

  - id: data-transfer-time
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions:
      - "0.3.0"
      - "0.4.0"
      - "0.5.0"
    jurisdiction: global
    precision_policy: canonical_ascii_decimal_string_max_1000_digits
    rounding_policy: caller_decimal_places_0_to_100_half_away_from_zero
    inputs:
      - id: data_size
        value_kind: decimal
        unit_dimension: data_size
        unit_policy: enumerated
        unit_options:
          - bit
          - byte
          - kilobit
          - kilobyte
          - megabit
          - megabyte
          - gigabit
          - gigabyte
          - terabit
          - terabyte
          - kibibyte
          - mebibyte
          - gibibyte
          - tebibyte
        allowed_values: []
        required: true
        domain: non_negative_finite_decimal
      - id: data_rate
        value_kind: decimal
        unit_dimension: data_rate
        unit_policy: enumerated
        unit_options:
          - bits_per_second
          - kilobits_per_second
          - megabits_per_second
          - gigabits_per_second
        allowed_values: []
        required: true
        domain: positive_finite_decimal
    outputs:
      - id: transfer_duration
        value_kind: decimal
        unit_dimension: duration
        unit_policy: enumerated
        unit_options:
          - seconds
    error_codes:
      - invalid_input
      - domain_error
      - limit_exceeded
      - contract_mismatch
      - unsupported_unit
      - precision_policy_required
      - rounding_policy_required
    semantic_rules:
      - decimal_prefix_units_use_powers_of_1000
      - binary_prefix_units_use_powers_of_1024
      - byte_units_convert_to_eight_bits_per_byte
      - data_rate_normalizes_to_bits_per_second
      - transfer_duration_is_total_bits_divided_by_bits_per_second
      - zero_data_size_returns_zero_seconds
      - negative_data_size_returns_domain_error
      - non_positive_data_rate_returns_domain_error
      - unknown_size_or_rate_unit_returns_unsupported_unit

  - id: date-difference
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions:
      - "0.4.0"
      - "0.5.0"
    jurisdiction: global
    precision_policy: exact_integer_calendar_days_years_0001_to_9999
    rounding_policy: not_applicable_exact_integer
    inputs:
      - id: start_date
        value_kind: date
        unit_dimension: date
        unit_policy: none
        unit_options: []
        allowed_values: []
        required: true
        domain: strict_ascii_yyyy_mm_dd_proleptic_gregorian_years_0001_to_9999
      - id: end_date
        value_kind: date
        unit_dimension: date
        unit_policy: none
        unit_options: []
        allowed_values: []
        required: true
        domain: strict_ascii_yyyy_mm_dd_proleptic_gregorian_years_0001_to_9999
      - id: boundary_mode
        value_kind: enum
        unit_dimension: dimensionless
        unit_policy: none
        unit_options: []
        allowed_values:
          - exclusive
          - inclusive
        required: true
        domain: allowed_values_only
    outputs:
      - id: calendar_day_count
        value_kind: integer
        unit_dimension: duration
        unit_policy: enumerated
        unit_options:
          - days
    error_codes:
      - invalid_input
      - domain_error
      - limit_exceeded
      - contract_mismatch
      - invalid_date_range
    semantic_rules:
      - inputs_match_ascii_yyyy_mm_dd_exactly
      - supported_years_are_0001_through_9999_inclusive
      - dates_use_the_proleptic_gregorian_calendar
      - leap_years_follow_the_4_100_400_rule
      - time_of_day_and_timezone_are_not_accepted
      - end_date_before_start_date_returns_invalid_date_range
      - exclusive_mode_counts_start_inclusive_end_exclusive
      - inclusive_mode_includes_both_boundaries

  - id: studycafe-seat-occupancy
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions:
      - "0.5.0"
    jurisdiction: global
    precision_policy: canonical_ascii_decimal_string_max_1000_digits
    rounding_policy: caller_decimal_places_0_to_100_half_away_from_zero
    inputs:
      - id: seat_count
        value_kind: integer
        unit_dimension: count
        unit_policy: enumerated
        unit_options: [seats]
        allowed_values: []
        required: true
        domain: canonical_positive_integer_string
      - id: opening_days_per_month
        value_kind: integer
        unit_dimension: duration
        unit_policy: enumerated
        unit_options: [days]
        allowed_values: []
        required: true
        domain: canonical_positive_integer_string
      - id: opening_hours_per_day
        value_kind: decimal
        unit_dimension: duration
        unit_policy: enumerated
        unit_options: [hours]
        allowed_values: []
        required: true
        domain: positive_finite_decimal
      - id: occupied_seat_hours
        value_kind: decimal
        unit_dimension: duration
        unit_policy: enumerated
        unit_options: [seat_hours]
        allowed_values: []
        required: true
        domain: non_negative_finite_decimal_not_exceeding_available_seat_hours
    outputs:
      - id: available_seat_hours
        value_kind: decimal
        unit_dimension: duration
        unit_policy: enumerated
        unit_options: [seat_hours]
      - id: occupancy_percentage
        value_kind: decimal
        unit_dimension: percent
        unit_policy: enumerated
        unit_options: [percent]
    error_codes: [invalid_input, domain_error, limit_exceeded, contract_mismatch, denominator_zero, precision_policy_required, rounding_policy_required]
    semantic_rules:
      - available_seat_hours_is_seat_count_times_opening_days_times_opening_hours
      - occupancy_percentage_is_occupied_seat_hours_divided_by_available_seat_hours_times_100
      - occupied_seat_hours_must_not_exceed_available_seat_hours

  - id: studycafe-break-even
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions: ["0.5.0"]
    jurisdiction: global
    precision_policy: canonical_ascii_decimal_string_max_1000_digits
    rounding_policy: caller_decimal_places_0_to_100_half_away_from_zero
    inputs:
      - { id: seat_count, value_kind: integer, unit_dimension: count, unit_policy: enumerated, unit_options: [seats], allowed_values: [], required: true, domain: canonical_positive_integer_string }
      - { id: opening_days_per_month, value_kind: integer, unit_dimension: duration, unit_policy: enumerated, unit_options: [days], allowed_values: [], required: true, domain: canonical_positive_integer_string }
      - { id: opening_hours_per_day, value_kind: decimal, unit_dimension: duration, unit_policy: enumerated, unit_options: [hours], allowed_values: [], required: true, domain: positive_finite_decimal }
      - { id: average_seat_hour_price, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: positive_finite_decimal }
      - { id: monthly_fixed_cost, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
      - { id: variable_cost_ratio, value_kind: decimal, unit_dimension: dimensionless, unit_policy: none, unit_options: [], allowed_values: [], required: true, domain: finite_decimal_ratio_zero_inclusive_one_exclusive }
    outputs:
      - { id: break_even_revenue, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [] }
      - { id: break_even_occupancy_percentage, value_kind: decimal, unit_dimension: percent, unit_policy: enumerated, unit_options: [percent] }
    error_codes: [invalid_input, domain_error, limit_exceeded, contract_mismatch, denominator_zero, incompatible_units, precision_policy_required, rounding_policy_required]
    semantic_rules:
      - break_even_revenue_is_monthly_fixed_cost_divided_by_one_minus_variable_cost_ratio
      - full_capacity_revenue_is_seat_count_times_opening_days_times_opening_hours_times_average_seat_hour_price
      - break_even_occupancy_percentage_is_break_even_revenue_divided_by_full_capacity_revenue_times_100
      - all_currency_inputs_must_match

  - id: kiosk-roi
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions: ["0.5.0"]
    jurisdiction: global
    precision_policy: canonical_ascii_decimal_string_max_1000_digits
    rounding_policy: caller_decimal_places_0_to_100_half_away_from_zero
    inputs:
      - { id: initial_investment, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
      - { id: monthly_incremental_revenue, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
      - { id: monthly_labor_savings, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
      - { id: monthly_additional_operating_cost, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
    outputs:
      - { id: monthly_net_benefit, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [] }
      - { id: payback_months, value_kind: decimal, unit_dimension: duration, unit_policy: enumerated, unit_options: [months] }
    error_codes: [invalid_input, domain_error, limit_exceeded, contract_mismatch, denominator_zero, incompatible_units, precision_policy_required, rounding_policy_required]
    semantic_rules:
      - monthly_net_benefit_is_incremental_revenue_plus_labor_savings_minus_additional_operating_cost
      - non_positive_monthly_net_benefit_returns_domain_error
      - payback_months_is_initial_investment_divided_by_monthly_net_benefit
      - all_currency_inputs_must_match

  - id: unattended-labor-savings
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions: ["0.5.0"]
    jurisdiction: global
    precision_policy: canonical_ascii_decimal_string_max_1000_digits
    rounding_policy: caller_decimal_places_0_to_100_half_away_from_zero
    inputs:
      - { id: current_monthly_labor_cost, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
      - { id: unattended_monthly_labor_cost, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
      - { id: additional_monthly_system_cost, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
    outputs:
      - { id: gross_monthly_labor_savings, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [] }
      - { id: net_monthly_savings, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [] }
    error_codes: [invalid_input, domain_error, limit_exceeded, contract_mismatch, incompatible_units, precision_policy_required, rounding_policy_required]
    semantic_rules:
      - gross_monthly_labor_savings_is_current_cost_minus_unattended_cost
      - net_monthly_savings_is_gross_savings_minus_additional_system_cost
      - negative_savings_are_preserved_as_loss_signals
      - all_currency_inputs_must_match

  - id: locker-revenue
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions: ["0.5.0"]
    jurisdiction: global
    precision_policy: canonical_ascii_decimal_string_max_1000_digits
    rounding_policy: caller_decimal_places_0_to_100_half_away_from_zero
    inputs:
      - { id: locker_count, value_kind: integer, unit_dimension: count, unit_policy: enumerated, unit_options: [lockers], allowed_values: [], required: true, domain: canonical_non_negative_integer_string }
      - { id: monthly_price_per_locker, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
      - { id: utilization_ratio, value_kind: decimal, unit_dimension: dimensionless, unit_policy: none, unit_options: [], allowed_values: [], required: true, domain: finite_decimal_ratio_zero_to_one_inclusive }
      - { id: monthly_operating_cost, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
    outputs:
      - { id: monthly_gross_revenue, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [] }
      - { id: monthly_net_revenue, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [] }
    error_codes: [invalid_input, domain_error, limit_exceeded, contract_mismatch, incompatible_units, precision_policy_required, rounding_policy_required]
    semantic_rules:
      - monthly_gross_revenue_is_locker_count_times_price_times_utilization_ratio
      - monthly_net_revenue_is_gross_revenue_minus_operating_cost
      - all_currency_inputs_must_match

  - id: study-room-schedule-revenue
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions: ["0.5.0"]
    jurisdiction: global
    precision_policy: canonical_ascii_decimal_string_max_1000_digits
    rounding_policy: caller_decimal_places_0_to_100_half_away_from_zero
    inputs:
      - { id: bookable_room_hours, value_kind: decimal, unit_dimension: duration, unit_policy: enumerated, unit_options: [room_hours], allowed_values: [], required: true, domain: non_negative_finite_decimal }
      - { id: booking_ratio, value_kind: decimal, unit_dimension: dimensionless, unit_policy: none, unit_options: [], allowed_values: [], required: true, domain: finite_decimal_ratio_zero_to_one_inclusive }
      - { id: average_hourly_price, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
      - { id: monthly_operating_cost, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
    outputs:
      - { id: booked_room_hours, value_kind: decimal, unit_dimension: duration, unit_policy: enumerated, unit_options: [room_hours] }
      - { id: monthly_gross_revenue, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [] }
      - { id: monthly_net_revenue, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [] }
    error_codes: [invalid_input, domain_error, limit_exceeded, contract_mismatch, incompatible_units, precision_policy_required, rounding_policy_required]
    semantic_rules:
      - booked_room_hours_is_bookable_room_hours_times_booking_ratio
      - monthly_gross_revenue_is_booked_room_hours_times_average_hourly_price
      - monthly_net_revenue_is_gross_revenue_minus_operating_cost
      - all_currency_inputs_must_match

  - id: security-cost-break-even
    lifecycle_status: reviewed
    contract_version: "1.0.0"
    compatible_engine_versions: ["0.5.0"]
    jurisdiction: global
    precision_policy: canonical_ascii_decimal_string_max_1000_digits
    rounding_policy: caller_decimal_places_0_to_100_half_away_from_zero
    inputs:
      - { id: monthly_base_fixed_cost, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
      - { id: monthly_security_cost, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
      - { id: unit_price, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: positive_finite_decimal }
      - { id: unit_variable_cost, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [], allowed_values: [], required: true, domain: non_negative_finite_decimal }
    outputs:
      - { id: total_monthly_fixed_cost, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [] }
      - { id: contribution_margin_per_unit, value_kind: decimal, unit_dimension: currency, unit_policy: caller_supplied, unit_options: [] }
      - { id: break_even_quantity, value_kind: decimal, unit_dimension: count, unit_policy: enumerated, unit_options: [items] }
    error_codes: [invalid_input, domain_error, limit_exceeded, contract_mismatch, non_positive_contribution_margin, incompatible_units, precision_policy_required, rounding_policy_required]
    semantic_rules:
      - total_monthly_fixed_cost_is_base_fixed_cost_plus_security_cost
      - contribution_margin_is_unit_price_minus_unit_variable_cost
      - non_positive_contribution_margin_returns_specific_error
      - break_even_quantity_is_total_monthly_fixed_cost_divided_by_contribution_margin
      - all_currency_inputs_must_match
