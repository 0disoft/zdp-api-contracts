    options: {}
    expected: { status: error, error_code: invalid_date_range }

  - id: date-difference.non-padded-date
    calculator_id: date-difference
    input: { start_date: "2024-2-01", end_date: "2024-02-02", boundary_mode: exclusive }
    options: {}
    expected: { status: error, error_code: invalid_input }

  - id: date-difference.timestamp-rejected
    calculator_id: date-difference
    input: { start_date: "2024-01-01T00:00:00", end_date: "2024-01-02", boundary_mode: exclusive }
    options: {}
    expected: { status: error, error_code: invalid_input }

