    options: {}
    expected:
      status: success
      output:
        calendar_day_count: { value: 1, unit: days }

  - id: date-difference.supported-range-exclusive
    calculator_id: date-difference
    input: { start_date: "0001-01-01", end_date: "9999-12-31", boundary_mode: exclusive }
    options: {}
    expected:
      status: success
      output:
