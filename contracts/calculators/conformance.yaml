  - id: compound-interest.currency-preserved
    calculator_id: compound-interest
    input: { principal: { value: "100", unit: EUR }, nominal_annual_rate: "0.05", compounding_periods: "1", compounding_frequency: "1_per_year" }
    options: { decimal_places: 2 }
    expected:
      status: success
      output:
        future_value: { value: "105.00", unit: EUR }
        interest_earned: { value: "5.00", unit: EUR }

  - id: compound-interest.rate-negative-one
    calculator_id: compound-interest
    input: { principal: { value: "100", unit: USD }, nominal_annual_rate: "-1", compounding_periods: "1", compounding_frequency: "1_per_year" }
    options: { decimal_places: 2 }
    expected: { status: error, error_code: domain_error }

  - id: compound-interest.negative-principal
    calculator_id: compound-interest
    input: { principal: { value: "-1", unit: USD }, nominal_annual_rate: "0.05", compounding_periods: "1", compounding_frequency: "1_per_year" }
    options: { decimal_places: 2 }
    expected: { status: error, error_code: domain_error }

  - id: compound-interest.malformed-periods
    calculator_id: compound-interest
    input: { principal: { value: "100", unit: USD }, nominal_annual_rate: "0.05", compounding_periods: "1.5", compounding_frequency: "1_per_year" }
    options: { decimal_places: 2 }
    expected: { status: error, error_code: invalid_input }

  - id: compound-interest.unknown-frequency
    calculator_id: compound-interest
    input: { principal: { value: "100", unit: USD }, nominal_annual_rate: "0.05", compounding_periods: "1", compounding_frequency: "52_per_year" }
    options: { decimal_places: 2 }
    expected: { status: error, error_code: invalid_input }

  - id: compound-interest.period-limit
    calculator_id: compound-interest
    input: { principal: { value: "100", unit: USD }, nominal_annual_rate: "0.05", compounding_periods: "36501", compounding_frequency: "365_per_year" }
    options: { decimal_places: 2 }
    expected: { status: error, error_code: limit_exceeded }
