      status: success
      output:
        transfer_duration: { value: "1000000000000", unit: seconds }

  - id: data-transfer-time.size-terabyte
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: terabyte }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "8000000000000", unit: seconds }

  - id: data-transfer-time.size-kibibyte
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: kibibyte }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "8192", unit: seconds }

  - id: data-transfer-time.size-mebibyte
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: mebibyte }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "8388608", unit: seconds }

  - id: data-transfer-time.size-tebibyte
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: tebibyte }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "8796093022208", unit: seconds }

  - id: data-transfer-time.rate-kilobits
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: megabit }
      data_rate: { value: "1", unit: kilobits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "1000", unit: seconds }

  - id: data-transfer-time.negative-rate
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: byte }
      data_rate: { value: "-1", unit: bits_per_second }
    options: { decimal_places: 2 }
    expected:
      status: error
      error_code: domain_error

  - id: date-difference.same-day-exclusive
    calculator_id: date-difference
    input: { start_date: "2024-06-15", end_date: "2024-06-15", boundary_mode: exclusive }
    options: {}
    expected:
      status: success
      output:
        calendar_day_count: { value: 0, unit: days }

  - id: date-difference.same-day-inclusive
    calculator_id: date-difference
    input: { start_date: "2024-06-15", end_date: "2024-06-15", boundary_mode: inclusive }
    options: {}
    expected:
      status: success
      output:
        calendar_day_count: { value: 1, unit: days }

  - id: date-difference.adjacent-exclusive
    calculator_id: date-difference
    input: { start_date: "2024-06-15", end_date: "2024-06-16", boundary_mode: exclusive }
    options: {}
    expected:
      status: success
      output:
        calendar_day_count: { value: 1, unit: days }

  - id: date-difference.adjacent-inclusive
    calculator_id: date-difference
    input: { start_date: "2024-06-15", end_date: "2024-06-16", boundary_mode: inclusive }
    options: {}
    expected:
      status: success
      output:
        calendar_day_count: { value: 2, unit: days }

  - id: date-difference.leap-year-2000
    calculator_id: date-difference
    input: { start_date: "2000-02-28", end_date: "2000-03-01", boundary_mode: exclusive }
    options: {}
    expected:
      status: success
      output:
        calendar_day_count: { value: 2, unit: days }

  - id: date-difference.century-1900
    calculator_id: date-difference
    input: { start_date: "1900-02-28", end_date: "1900-03-01", boundary_mode: exclusive }
    options: {}
    expected:
      status: success
      output:
        calendar_day_count: { value: 1, unit: days }

  - id: date-difference.month-boundary
    calculator_id: date-difference
    input: { start_date: "2023-01-31", end_date: "2023-02-01", boundary_mode: exclusive }
    options: {}
