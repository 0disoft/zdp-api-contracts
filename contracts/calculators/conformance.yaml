calculator_conformance:
  schema_version: 1
  contract_version: "1.0.0"
  engine_version_range: "0.x"
  decimal_input_policy: canonical_ascii_decimal_string
  max_input_digits: 1000
  max_decimal_places: 100
  rounding_mode: half_away_from_zero

cases:
  - id: percentage-change.basic-increase
    calculator_id: percentage-change
    input:
      initial_value: "100"
      final_value: "125"
    options:
      decimal_places: 2
    expected:
      status: success
      output:
        percentage_change:
          value: "25.00"
          unit: percent

  - id: percentage-change.signed-decrease
    calculator_id: percentage-change
    input:
      initial_value: "200"
      final_value: "150"
    options:
      decimal_places: 2
    expected:
      status: success
      output:
        percentage_change:
          value: "-25.00"
          unit: percent

  - id: percentage-change.half-away-rounding
    calculator_id: percentage-change
    input:
      initial_value: "2000"
      final_value: "2063"
    options:
      decimal_places: 1
    expected:
      status: success
      output:
        percentage_change:
          value: "3.2"
          unit: percent

  - id: percentage-change.negative-denominator
    calculator_id: percentage-change
    input:
      initial_value: "-100"
      final_value: "-50"
    options:
      decimal_places: 2
    expected:
      status: success
      output:
        percentage_change:
          value: "-50.00"
          unit: percent

  - id: percentage-change.zero-denominator
    calculator_id: percentage-change
    input:
      initial_value: "0"
      final_value: "5"
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: denominator_zero

  - id: percentage-change.locale-formatted-input
    calculator_id: percentage-change
    input:
      initial_value: "1,000"
      final_value: "1250"
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: invalid_input

  - id: margin-markup.basic-profit
    calculator_id: margin-markup
    input:
      cost:
        value: "80"
        unit: USD
      selling_price:
        value: "100"
        unit: USD
    options:
      decimal_places: 2
    expected:
      status: success
      output:
        margin_percentage:
          value: "20.00"
          unit: percent
        markup_percentage:
          value: "25.00"
          unit: percent

  - id: margin-markup.loss
    calculator_id: margin-markup
    input:
      cost:
        value: "120"
        unit: USD
      selling_price:
        value: "100"
        unit: USD
    options:
      decimal_places: 2
    expected:
      status: success
      output:
        margin_percentage:
          value: "-20.00"
          unit: percent
        markup_percentage:
          value: "-16.67"
          unit: percent

  - id: margin-markup.currency-mismatch
    calculator_id: margin-markup
    input:
      cost:
        value: "80"
        unit: USD
      selling_price:
        value: "100"
        unit: EUR
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: incompatible_units

  - id: margin-markup.zero-cost
    calculator_id: margin-markup
    input:
      cost:
        value: "0"
        unit: USD
      selling_price:
        value: "100"
        unit: USD
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: denominator_zero

  - id: margin-markup.negative-cost
    calculator_id: margin-markup
    input:
      cost:
        value: "-1"
        unit: USD
      selling_price:
        value: "100"
        unit: USD
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: domain_error

  - id: break-even-point.basic
    calculator_id: break-even-point
    input:
      fixed_cost:
        value: "1000"
        unit: USD
      unit_price:
        value: "50"
        unit: USD
      unit_variable_cost:
        value: "30"
        unit: USD
    options:
      decimal_places: 2
    expected:
      status: success
      output:
        contribution_margin_per_unit:
          value: "20.00"
          unit: USD
        break_even_quantity:
          value: "50.00"
          unit: items

  - id: break-even-point.zero-fixed-cost
    calculator_id: break-even-point
    input:
      fixed_cost:
        value: "0"
        unit: EUR
      unit_price:
        value: "25"
        unit: EUR
      unit_variable_cost:
        value: "10"
        unit: EUR
    options:
      decimal_places: 2
    expected:
      status: success
      output:
        contribution_margin_per_unit:
          value: "15.00"
          unit: EUR
        break_even_quantity:
          value: "0.00"
          unit: items

  - id: break-even-point.half-away-rounding
    calculator_id: break-even-point
    input:
      fixed_cost:
        value: "5"
        unit: USD
      unit_price:
        value: "7"
        unit: USD
      unit_variable_cost:
        value: "5"
        unit: USD
    options:
      decimal_places: 0
    expected:
      status: success
      output:
        contribution_margin_per_unit:
          value: "2"
          unit: USD
        break_even_quantity:
          value: "3"
          unit: items

  - id: break-even-point.zero-contribution-margin
    calculator_id: break-even-point
    input:
      fixed_cost:
        value: "1000"
        unit: USD
      unit_price:
        value: "30"
        unit: USD
      unit_variable_cost:
        value: "30"
        unit: USD
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: non_positive_contribution_margin

  - id: break-even-point.negative-contribution-margin
    calculator_id: break-even-point
    input:
      fixed_cost:
        value: "1000"
        unit: USD
      unit_price:
        value: "20"
        unit: USD
      unit_variable_cost:
        value: "30"
        unit: USD
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: non_positive_contribution_margin

  - id: break-even-point.currency-mismatch
    calculator_id: break-even-point
    input:
      fixed_cost:
        value: "1000"
        unit: USD
      unit_price:
        value: "50"
        unit: EUR
      unit_variable_cost:
        value: "30"
        unit: USD
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: incompatible_units

  - id: break-even-point.negative-fixed-cost
    calculator_id: break-even-point
    input:
      fixed_cost:
        value: "-1"
        unit: USD
      unit_price:
        value: "50"
        unit: USD
      unit_variable_cost:
        value: "30"
        unit: USD
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: domain_error

  - id: data-transfer-time.decimal-gigabyte
    calculator_id: data-transfer-time
    input:
      data_size:
        value: "1"
        unit: gigabyte
      data_rate:
        value: "100"
        unit: megabits_per_second
    options:
      decimal_places: 2
    expected:
      status: success
      output:
        transfer_duration:
          value: "80.00"
          unit: seconds

  - id: data-transfer-time.binary-gibibyte
    calculator_id: data-transfer-time
    input:
      data_size:
        value: "1"
        unit: gibibyte
      data_rate:
        value: "100"
        unit: megabits_per_second
    options:
      decimal_places: 2
    expected:
      status: success
      output:
        transfer_duration:
          value: "85.90"
          unit: seconds

  - id: data-transfer-time.zero-size
    calculator_id: data-transfer-time
    input:
      data_size:
        value: "0"
        unit: byte
      data_rate:
        value: "1"
        unit: gigabits_per_second
    options:
      decimal_places: 2
    expected:
      status: success
      output:
        transfer_duration:
          value: "0.00"
          unit: seconds

  - id: data-transfer-time.half-away-rounding
    calculator_id: data-transfer-time
    input:
      data_size:
        value: "1"
        unit: bit
      data_rate:
        value: "8"
        unit: bits_per_second
    options:
      decimal_places: 2
    expected:
      status: success
      output:
        transfer_duration:
          value: "0.13"
          unit: seconds

  - id: data-transfer-time.unsupported-size-unit
    calculator_id: data-transfer-time
    input:
      data_size:
        value: "1"
        unit: petabyte
      data_rate:
        value: "1"
        unit: bits_per_second
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: unsupported_unit

  - id: data-transfer-time.unsupported-rate-unit
    calculator_id: data-transfer-time
    input:
      data_size:
        value: "1"
        unit: byte
      data_rate:
        value: "1"
        unit: bytes_per_second
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: unsupported_unit

  - id: data-transfer-time.zero-rate
    calculator_id: data-transfer-time
    input:
      data_size:
        value: "1"
        unit: byte
      data_rate:
        value: "0"
        unit: bits_per_second
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: domain_error

  - id: data-transfer-time.negative-size
    calculator_id: data-transfer-time
    input:
      data_size:
        value: "-1"
        unit: byte
      data_rate:
        value: "1"
        unit: bits_per_second
    options:
      decimal_places: 2
    expected:
      status: error
      error_code: domain_error

  - id: data-transfer-time.size-kilobit
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: kilobit }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "1000", unit: seconds }

  - id: data-transfer-time.size-kilobyte
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: kilobyte }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "8000", unit: seconds }

  - id: data-transfer-time.size-megabit
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: megabit }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "1000000", unit: seconds }

  - id: data-transfer-time.size-megabyte
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: megabyte }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "8000000", unit: seconds }

  - id: data-transfer-time.size-gigabit
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: gigabit }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "1000000000", unit: seconds }

  - id: data-transfer-time.size-terabit
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: terabit }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "1000000000000", unit: seconds }

  - id: data-transfer-time.size-terabyte
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: terabyte }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "8000000000000", unit: seconds }

  - id: data-transfer-time.size-kibibyte
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: kibibyte }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "8192", unit: seconds }

  - id: data-transfer-time.size-mebibyte
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: mebibyte }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "8388608", unit: seconds }

  - id: data-transfer-time.size-tebibyte
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: tebibyte }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "8796093022208", unit: seconds }

  - id: data-transfer-time.rate-kilobits
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: megabit }
      data_rate: { value: "1", unit: kilobits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "1000", unit: seconds }

  - id: data-transfer-time.negative-rate
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: byte }
      data_rate: { value: "-1", unit: bits_per_second }
    options: { decimal_places: 2 }
    expected:
      status: error
      error_code: domain_error
