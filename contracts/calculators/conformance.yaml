  - id: data-transfer-time.size-megabit
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: megabit }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
        transfer_duration: { value: "1000000", unit: seconds }

  - id: data-transfer-time.size-megabyte
    calculator_id: data-transfer-time
    input:
      data_size: { value: "1", unit: megabyte }
      data_rate: { value: "1", unit: bits_per_second }
    options: { decimal_places: 0 }
    expected:
      status: success
      output:
