    options: {}
    expected: { status: error, error_code: invalid_input }

  - id: date-difference.contract-mismatch
    calculator_id: date-difference
    input: { start_date: "2024-01-01", end_date: "2024-01-02", boundary_mode: exclusive }
    options: {}
    expected: { status: error, error_code: contract_mismatch }

  - id: compound-interest.annual-two-periods
    calculator_id: compound-interest
    input: { principal: { value: "100", unit: USD }, nominal_annual_rate: "0.05", compounding_periods: "2", compounding_frequency: "1_per_year" }
