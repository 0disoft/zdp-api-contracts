name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: npm-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::Release tag must point to a commit contained in origin/main."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Verify trusted publishing runtime
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (![major, minor, patch].every(Number.isInteger) || major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error(`npm ${process.argv[1]} does not support trusted publishing; npm 11.5.1 or later is required.`);
            }
          ' "$npm_version"

      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Check npm registry state
        id: npm_state
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify existing npm source anchor
        if: steps.npm_state.outputs.already_published == 'true'
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          published_git_head="$(npm view "${package_name}@${package_version}" gitHead 2>/dev/null || true)"
          if [ "$published_git_head" != "$GITHUB_SHA" ]; then
            echo "::error::Published npm gitHead ${published_git_head:-unavailable} does not match release tag SHA ${GITHUB_SHA}."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package contracts
        run: bun run check

      - name: Verify export plan
        run: bun run export:plan

      - name: Verify generated dist
        run: bun run dist:check

      - name: Verify packed consumer
        run: bun run smoke:package

      - name: Publish package
        if: steps.npm_state.outputs.already_published != 'true'
        run: npm publish --access public --provenance

      - name: Verify npm registry result
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          max_attempts=12
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            published_version="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
            published_git_head="$(npm view "${package_name}@${package_version}" gitHead 2>/dev/null || true)"
            published_integrity="$(npm view "${package_name}@${package_version}" dist.integrity 2>/dev/null || true)"
            if [ "$published_version" = "$package_version" ] && [ "$published_git_head" = "$GITHUB_SHA" ] && [ -n "$published_integrity" ]; then
              npm view "${package_name}@${package_version}" dist.tarball
              exit 0
            fi

            if [ "$published_version" = "$package_version" ] && [ -n "$published_git_head" ] && [ "$published_git_head" != "$GITHUB_SHA" ]; then
              echo "::error::Published npm gitHead ${published_git_head} does not match release tag SHA ${GITHUB_SHA}."
              exit 1
            fi

            echo "npm version/source metadata is not ready for ${package_name}@${package_version}; retrying (${attempt}/${max_attempts})."
            sleep 5
            attempt=$((attempt + 1))
          done

          echo "::error::npm did not expose ${package_name}@${package_version} after ${max_attempts} attempts."
          exit 1

      - name: Verify published consumer and provenance
        run: bun run smoke:published
